    body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;}
    .num{font-variant-numeric:tabular-nums;}
    .card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,0.04);transition:all .2s ease;}
    .card:hover{box-shadow:0 4px 16px rgba(16,24,40,0.06);border-color:var(--border-strong);}
    .pulse-dot{animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .fade-in{animation:fadeIn .25s ease-out;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    input[type=range]{-webkit-appearance:none;background:transparent;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:16px;width:16px;border-radius:50%;background:var(--accent);cursor:pointer;margin-top:-6px;box-shadow:0 2px 4px rgba(239,68,68,0.3);}
    input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;cursor:pointer;background:#e8e8e8;border-radius:2px;}
    .strat-card{border-radius:10px;background:#fff;border:1px solid var(--border);transition:all .15s;overflow:hidden;}
    .strat-card:hover{border-color:var(--border-strong);box-shadow:0 4px 12px rgba(16,24,40,.06);}
    .tab-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--text-secondary);border-radius:8px 8px 0 0;border:none;background:transparent;cursor:pointer;transition:all .15s;position:relative;}
    .tab-btn:hover{color:var(--text-primary);background:#f8fafc;}
    .tab-btn.active{color:var(--accent);background:var(--accent-soft);}
    .tab-btn.active::after{content:"";position:absolute;bottom:-1px;left:8px;right:8px;height:2px;background:var(--accent);border-radius:2px;}
  </style>
